name: cubi-desktop

on:
  pull_request:
    branches: [main]
    paths:
      - "cubi-desktop/**"
      - ".github/workflows/cubi-desktop.yml"
  push:
    branches: [main]
    paths:
      - "cubi-desktop/**"
      - ".github/workflows/cubi-desktop.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cubi-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: cubi-desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Paketprüfung (deps.sh)
        run: ./deps.sh --check

      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal -c clippy -c rustfmt
          rustup default stable

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      - name: cargo build --release
        run: cargo build --release

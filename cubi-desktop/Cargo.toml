[package]
description = "Desktop-Oberfläche für cubi: alle cubi-Bereiche plus lokale CI-Checks vor dem Push"
name = "cubi-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["clock"] }
dirs = "7.0.0"
eframe = "0.37.0"
egui_extras = "0.37.0"
globset = "0.4.21"
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }
nix = { version = "0.32.0", features = ["signal", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros", "signal"] }
tokio-util = "0.7.20"
toml = "1.2.1"
which = "8.0.6"

[features]
screenshot = ["dep:image"]

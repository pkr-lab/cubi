connect:
  vm:
    - name: vm-prod
      ssh: prod-vm
    - name: vm-entw
      ssh: entw-vm
  hosts:
    - name: homeserver
      ssh: homeserver
    - name: worker-0
      ssh: worker-0
    - name: worker-1
      ssh: worker-1
    - name: infotafel
      ssh: infotafel
    - name: alarm-monitor
      ssh: alarm-monitor

argocd:
  namespace: argocd
  contexts:
    - name: kubernetes
      core: true
    - name: homeserver
      server: argocd.tech.homeserver
      username: admin

github:
  default_repo: pkr-lab/capulus-core
  repos:
    - pkr-lab/capulus-core
    - pkr-lab/cubi

tokens:
  repo: ~/gitlab/kubernetes/capulus-core
  docs_repo: ~/gitlab/pkr-lab-docs
